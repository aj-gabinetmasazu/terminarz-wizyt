<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#64152d"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Terminarz wizyt – wspólna baza</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--b:#64152d;--bd:#3d0b1c;--g:#d7ad55;--bg:#f6f0e5;--card:#fffdf8;--ink:#24151a;--line:#d8c8aa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
body{padding-top:62px}.top{position:fixed;z-index:20;top:0;left:0;right:0;height:62px;background:linear-gradient(90deg,var(--bd),var(--b));color:#fff;display:flex;align-items:center;padding-top:env(safe-area-inset-top);box-shadow:0 2px 10px #0003}.top h1{font-size:18px;margin-left:15px}.top button{margin-left:auto;margin-right:12px}
.wrap{max-width:1150px;margin:auto;padding:10px}.grid{display:grid;grid-template-columns:330px 1fr;gap:12px}.card{background:var(--card);border:1px solid var(--line);padding:14px;box-shadow:0 2px 8px #0001}
h2{margin:0 0 12px;color:var(--b);font-size:18px}label{display:block;font-size:13px;font-weight:bold;margin:9px 0 4px}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #bfae8f;background:#fff;border-radius:0}textarea{min-height:65px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:1px solid var(--g);background:linear-gradient(#8b2443,var(--b));color:#fff;padding:10px 13px;font-weight:bold;border-radius:0;min-height:42px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.monthbar strong{text-transform:capitalize;color:var(--b);font-size:18px}.monthbar button{width:45px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.dow{text-align:center;font-size:11px;font-weight:bold;color:#765b36;padding:4px}.day{min-height:91px;background:#fff;border:1px solid var(--line);padding:5px}.day.muted{background:#f3eee5;color:#aaa}.day.today{outline:2px solid var(--g);outline-offset:-2px}.day.sel{background:#fff2c8}.num{font-weight:bold;font-size:12px}.appt{font-size:10px;margin-top:4px;padding:3px 4px;background:var(--b);color:#fff;border-left:2px solid var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item{border-top:1px solid #e4dac7;padding:10px 0}.item:first-child{border-top:0}.item b{color:var(--b)}.small{font-size:12px;color:#6d6255}.empty{text-align:center;padding:18px;color:#887d70}.status{font-size:12px;margin:5px 0 12px;padding:8px;background:#fff4cf;border:1px solid var(--g);color:var(--b)}
#login{max-width:420px;margin:70px auto}.hidden{display:none}
@media(max-width:800px){.grid{grid-template-columns:1fr}.day{min-height:74px}.wrap{padding:7px}}@media(max-width:520px){.row{grid-template-columns:1fr}.day{min-height:59px}.appt{display:none}.day.has:after{content:"•";display:block;color:var(--b);font-size:22px}}
</style></head>
<body>
<header class="top"><h1>TERMINARZ WIZYT</h1><button id="logout" class="hidden">Wyloguj</button></header>
<section id="login" class="card">
<h2>Logowanie</h2><div class="status">Wspólna baza online – zaloguj się swoim kontem.</div>
<label>E-mail</label><input id="email" type="email" autocomplete="username">
<label>Hasło</label><input id="password" type="password" autocomplete="current-password">
<div class="actions"><button id="loginBtn">Zaloguj</button><button id="signupBtn">Utwórz konto</button></div>
<div id="loginMsg" class="small"></div>
</section>
<main id="app" class="wrap hidden">
<div class="status" id="sync">● Połączono z bazą online</div>
<div class="grid">
<section class="card"><h2>Nowa wizyta</h2><form id="form">
<label>Imię i nazwisko klienta</label><input id="client" required>
<div class="row"><div><label>Data</label><input id="date" type="date" required></div><div><label>Godzina</label><input id="time" type="time" required></div></div>
<label>Rodzaj wizyty</label><input id="service" placeholder="np. konsultacja">
<div class="row"><div><label>Czas trwania</label><select id="duration"><option>30</option><option>45</option><option selected>60</option><option>90</option><option>120</option></select></div><div><label>Telefon</label><input id="phone" type="tel"></div></div>
<label>Notatka</label><textarea id="note"></textarea><div class="actions"><button>+ Umów wizytę</button><button type="button" id="clear">Wyczyść</button></div></form></section>
<section class="card"><div class="monthbar"><button id="prev">‹</button><strong id="title"></strong><button id="next">›</button></div><div class="week" id="calendar"></div></section>
<section class="card" style="grid-column:1/-1"><h2>Wizyty: <span id="selectedLabel"></span></h2><div id="list"></div></section>
</div></main>
<script>
const cfg=window.TERM_CONFIG||{};const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);
const WORKSPACE=cfg.WORKSPACE_ID;let view=new Date(),selected=new Date(),rows=[];
const $=x=>document.getElementById(x),iso=d=>d.toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const plDate=s=>new Intl.DateTimeFormat('pl-PL',{dateStyle:'full'}).format(new Date(s+'T12:00:00'));
function msg(t){$('loginMsg').textContent=t}
async function load(){let {data,error}=await sb.from('wizyty').select('*').eq('workspace_id',WORKSPACE).order('data').order('godzina');if(error){$('sync').textContent='Błąd połączenia: '+error.message;return}rows=data||[];render()}
function render(){let y=view.getFullYear(),m=view.getMonth(),f=new Date(y,m,1),start=(f.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),c=$('calendar');c.innerHTML='';$('title').textContent=new Intl.DateTimeFormat('pl-PL',{month:'long',year:'numeric'}).format(f);['Pn','Wt','Śr','Cz','Pt','Sb','Nd'].forEach(x=>{let e=document.createElement('div');e.className='dow';e.textContent=x;c.appendChild(e)});for(let i=0;i<42;i++){let n=i-start+1,d=new Date(y,m,n),e=document.createElement('div');e.className='day'+(n<1||n>days?' muted':'')+(iso(d)===iso(new Date())?' today':'')+(iso(d)===iso(selected)?' sel':'');let a=rows.filter(x=>x.data===iso(d));if(a.length)e.classList.add('has');e.innerHTML='<div class="num">'+d.getDate()+'</div>'+a.slice(0,3).map(x=>'<div class="appt">'+x.godzina.slice(0,5)+' '+esc(x.klient)+'</div>').join('');e.onclick=()=>{selected=d;$('date').value=iso(d);renderList()};c.appendChild(e)}renderList()}
function renderList(){let a=rows.filter(x=>x.data===iso(selected)).sort((x,y)=>x.godzina.localeCompare(y.godzina));$('selectedLabel').textContent=plDate(iso(selected));$('list').innerHTML=a.length?a.map(x=>'<div class="item"><b>'+x.godzina.slice(0,5)+' — '+esc(x.klient)+'</b> <span class="small">('+x.duration+' min)</span><div>'+esc(x.usluga||'Wizyta')+(x.telefon?' · '+esc(x.telefon):'')+'</div>'+(x.notatka?'<div class="small">'+esc(x.notatka)+'</div>':'')+'<button data-id="'+x.id+'" style="margin-top:7px;min-height:36px">Usuń</button></div>').join(''):'<div class="empty">Brak wizyt na ten dzień.</div>';$('list').querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(confirm('Usunąć tę wizytę?')){let {error}=await sb.from('wizyty').delete().eq('id',b.dataset.id);if(error)alert(error.message);else load()}})}
async function logged(){let {data}=await sb.auth.getSession();if(data.session){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('date').value=iso(selected);load()}else{$('login').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden')}}
$('loginBtn').onclick=async()=>{let {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)msg(error.message);else msg('Zalogowano.');logged()}
$('signupBtn').onclick=async()=>{let {data,error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});if(error)msg(error.message);else msg(data.session?'Konto utworzone.':'Konto utworzone – sprawdź e-mail, jeśli potwierdzenie jest wymagane.')}
$('logout').onclick=async()=>{await sb.auth.signOut();logged()}
$('form').onsubmit=async e=>{e.preventDefault();let x={workspace_id:WORKSPACE,klient:$('client').value.trim(),data:$('date').value,godzina:$('time').value,usluga:$('service').value.trim(),czas_trwania:+$('duration').value,telefon:$('phone').value.trim(),notatka:$('note').value.trim()};let {error}=await sb.from('wizyty').insert(x);if(error)alert(error.message);else{selected=new Date(x.data+'T12:00:00');e.target.reset();$('date').value=iso(selected);load()}}
$('clear').onclick=()=>{$('form').reset();$('date').value=iso(selected)};$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('todayBtn')?.addEventListener('click',()=>{view=new Date();selected=new Date();$('date').value=iso(selected);render()});
sb.channel('terminarz-wizyty').on('postgres_changes',{event:'*',schema:'public',table:'wizyty',filter:'workspace_id=eq.'+WORKSPACE},()=>load()).subscribe();
sb.auth.onAuthStateChange(()=>logged());logged();
</script></body></html>
